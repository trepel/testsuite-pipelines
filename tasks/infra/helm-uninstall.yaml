apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: helm-uninstall
spec:
  params:
    - description: Path to workspace kubeconfig
      name: kubeconfig-path
      type: string
  steps:
    - name: remove-leftovers-kuadrant-ns
      script: |
        #!/usr/bin/env bash
        crds=$(kubectl get crd -o jsonpath='{range .items[?(@.spec.scope=="Namespaced")]}{.metadata.name}{"\n"}{end}' | grep -E '\.kuadrant\.io$' | paste -sd, -)
        if [ -n "$crds" ]; then
            kubectl delete "$crds" -n "kuadrant" --all --ignore-not-found --wait=false
        fi

        # if dnsrecords.kuadrant.io gets stuck
        for record in $(kubectl get --chunk-size=0 -o name -n "kuadrant" dnsrecords.kuadrant.io 2>/dev/null); do
            if kubectl get -n "kuadrant" "$record" -o jsonpath='{.status.conditions}' | grep "The dns provider could not be loaded"; then
               echo "Force deleting (removing finalizers) due to missing secret on: $record";
               kubectl patch "$record" -n "kuadrant" --type=merge -p '{"metadata":{"finalizers":null}}';
            fi
        done
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
    - name: uninstall-instances
      args:
        - uninstall
        - -n=default
        - --ignore-not-found
        - --wait
        - kuadrant-instances
      command:
        - helm
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
    - name: uninstall-operators
      args:
        - uninstall
        - -n=default
        - --ignore-not-found
        - --wait
        - kuadrant-operators
      command:
        - helm
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
    - name: delete-cert-manager-namespace
      args:
        - kubectl delete --ignore-not-found ns/cert-manager
      command:
        - /bin/bash
        - -c
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
    - name: delete-kuadrant-crd
      args:
        - kubectl get crd -o name | grep "kuadrant" | xargs --no-run-if-empty kubectl delete
      command:
        - /bin/bash
        - -c
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
    - name: uninstall-tools-instances
      args:
        - uninstall
        - -n=default
        - --ignore-not-found
        - --wait
        - tools-instances
      command:
        - helm
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
    - name: uninstall-tools-operators
      args:
        - uninstall
        - -n=default
        - --ignore-not-found
        - --wait
        - tools-operators
      command:
        - helm
      env:
        - name: KUBECONFIG
          value: $(params.kubeconfig-path)
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
  workspaces:
  - name: shared-workspace
