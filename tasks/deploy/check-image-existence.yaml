apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-image-existence
spec:
  params:
    - description: Kuadrant image url
      name: index-image
      type: string
  steps:
    - env:
        - name: INDEX_IMAGE
          value: $(params.index-image)
      script: |
        #!/bin/bash
        set -euo pipefail
        umask 077
        AUTH_FILE=$(mktemp)
        trap 'rm -f "$AUTH_FILE"' EXIT

        echo "Reading openshift-config/pull-secret"
        kubectl get secret pull-secret -n openshift-config -o json \
          | jq -er '.data[".dockerconfigjson"]' \
          | base64 --decode > "$AUTH_FILE"

        if skopeo inspect --authfile "$AUTH_FILE" --no-tags "docker://${INDEX_IMAGE}" > /dev/null; then
          echo "Image inspection succeeded: ${INDEX_IMAGE}"
        else
          status=$?
          echo "Image inspection failed for ${INDEX_IMAGE} (exit ${status}); see Skopeo error above." >&2
          exit "$status"
        fi
      computeResources:
        limits:
          cpu: '250m'
          memory: 128Mi
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      name: check-image-existence
