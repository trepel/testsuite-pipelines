apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-auth-e2e-tests
spec:
  params:
    - description: Path to workspace kubeconfig
      name: kubeconfig-path
      type: string
    - description: Namespace MCP Gateway was deployed to
      name: mcp-gateway-namespace
      type: string
    - description: Gateway API provider (ocp/ossm3)
      name: istio-provider
      type: string
    - description: Run the actual auth e2e tests (true/false)
      name: run-tests
      type: string
  steps:
    - name: run-auth-e2e-tests
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      env:
      - name: KUBECONFIG
        value: $(params.kubeconfig-path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Populate env vars required for auth e2e tests
        export E2E_DOMAIN="apps.$(oc get dns cluster -o jsonpath='{.spec.baseDomain}')"
        export E2E_SCHEME=https
        export E2E_TIMEOUT=120m

        export MCP_GATEWAY_HOST="mcp.apps.$(oc get dns cluster -o jsonpath='{.spec.baseDomain}')"
        export GATEWAY_URL="${E2E_SCHEME}://${MCP_GATEWAY_HOST}/mcp"
        export KEYCLOAK_URL="https://keycloak.$E2E_DOMAIN"

        export MCP_GATEWAY_NAMESPACE="$(params.mcp-gateway-namespace)"
        export MCP_AUTH_E2E=true
        export MCP_AUTH_GATEWAY_URL="$GATEWAY_URL"
        export MCP_AUTH_KEYCLOAK_TOKEN_URL="$KEYCLOAK_URL/realms/mcp/protocol/openid-connect/token"
        export MCP_AUTH_NAMESPACE="$MCP_GATEWAY_NAMESPACE"
        export MCP_AUTH_TEST_SERVER_NAMESPACE=mcp-test
        export MCP_AUTH_BACKEND_HOSTNAME_SUFFIX="$E2E_DOMAIN"

        if [ "$(params.istio-provider)" = "ocp" ]; then
          export GATEWAY_CLASS_NAME=openshift-default
        else
          export GATEWAY_CLASS_NAME=istio
        fi

        # Restore the resources removed by the E2E testsuite's cleanup.
        if [ "$(params.run-tests)" = "true" ]; then
          if ! kubectl get gateway mcp-gateway -n gateway-system -o json | jq -e '.spec.listeners[] | select(.name == "mcp-tls")' > /dev/null; then
            GATEWAY_TLS_SECRET=$(kubectl get ingresscontroller default -n openshift-ingress-operator -o jsonpath='{.spec.defaultCertificate.name}')
            kubectl patch gateway mcp-gateway -n gateway-system --type=json -p "$(jq -n \
              --arg hostname "*.${E2E_DOMAIN}" --arg secret "$GATEWAY_TLS_SECRET" \
              '[{op: "add", path: "/spec/listeners/-", value: {
                name: "mcp-tls", port: 8443, protocol: "HTTPS", hostname: $hostname,
                tls: {mode: "Terminate", certificateRefs: [{name: $secret, kind: "Secret"}]},
                allowedRoutes: {namespaces: {from: "All"}}
              }}]')"
          fi
          kubectl apply -f - <<EOF
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: trusted-ca-bundle
          namespace: ${MCP_GATEWAY_NAMESPACE}
          labels:
            config.openshift.io/inject-trusted-cabundle: "true"
        ---
        apiVersion: gateway.networking.k8s.io/v1beta1
        kind: ReferenceGrant
        metadata:
          name: mcp-gateway-extension-to-gateway
          namespace: gateway-system
        spec:
          from:
            - group: mcp.kuadrant.io
              kind: MCPGatewayExtension
              namespace: ${MCP_GATEWAY_NAMESPACE}
          to:
            - group: gateway.networking.k8s.io
              kind: Gateway
        ---
        apiVersion: mcp.kuadrant.io/v1
        kind: MCPGatewayExtension
        metadata:
          name: mcp-gateway-extension
          namespace: ${MCP_GATEWAY_NAMESPACE}
        spec:
          caCertBundleRef:
            name: trusted-ca-bundle
            key: ca-bundle.crt
          publicHost: ${MCP_GATEWAY_HOST}
          targetRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: mcp-gateway
            namespace: gateway-system
            sectionName: mcp-tls
        EOF
          kubectl wait --for=condition=Ready mcpgatewayextension/mcp-gateway-extension -n "$MCP_GATEWAY_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/mcp-gateway -n "$MCP_GATEWAY_NAMESPACE" --timeout=5m
        fi

        # create mcp-test namespace if it does not exist
        oc create namespace mcp-test --dry-run=client -o yaml | oc apply -f -

        cd "$(workspaces.shared-workspace.path)/mcp-gateway"

        # deploy and register test MCP servers
        oc apply -k config/test-servers/

        if [ "$(params.run-tests)" = "true" ]; then
          # The auth test suite creates and cleans up these routes itself.
          oc delete httproute mcp-server1-route mcp-server2-route everything-server-route \
            -n "$MCP_AUTH_TEST_SERVER_NAMESPACE" --ignore-not-found --wait=true --timeout=60s
        else
          for route in mcp-server1-route mcp-server2-route everything-server-route; do
            hostname=$(oc get httproute "$route" -n mcp-test -o jsonpath='{.spec.hostnames[0]}')
            if [[ "$hostname" == *.mcp.local ]]; then
              hostname="${hostname%.mcp.local}.${E2E_DOMAIN}"
              oc patch httproute "$route" -n mcp-test --type=merge \
                -p "{\"spec\":{\"hostnames\":[\"${hostname}\"]}}"
            fi
          done
        fi

        # patch imagePullPolicy to pull the image from remote registry
        for dep in $(oc get deployments -n mcp-test -o jsonpath='{.items[*].metadata.name}'); do
          oc patch deployment "$dep" -n mcp-test --type='json' -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}]'
        done
        # wait for test MCP servers to get ready
        oc wait --for=condition=available --timeout=180s deployment/mcp-test-server1 -n mcp-test
        oc wait --for=condition=available --timeout=180s deployment/mcp-test-server2 -n mcp-test

        oc apply -f config/mcp-gateway/overlays/mcp-system/trusted-header-public-key.yaml -n $MCP_GATEWAY_NAMESPACE

        # Update Keycloak configuration, set HOSTNAME and PROXY_HEADERS env vars
        additional_options=$(kubectl get keycloak keycloak -n tools -o json | jq --arg hostname "$KEYCLOAK_URL" '
            (.spec.additionalOptions // []) | map(select(.name != "HOSTNAME" and .name != "PROXY_HEADERS")) +
            [{"name": "HOSTNAME", "value": $hostname}, {"name": "PROXY_HEADERS", "value": "xforwarded"}]
        ')
        kubectl patch keycloak keycloak -n tools --type=merge \
          -p "$(jq -n --argjson options "$additional_options" '{spec:{additionalOptions:$options}}')"

        # Add keycloak listener to mcp-gateway if it doesn't exist
        if ! kubectl get gateway mcp-gateway -n gateway-system -o json | jq -e '.spec.listeners[] | select(.name == "keycloak")' > /dev/null 2>&1; then
          kubectl patch gateway mcp-gateway -n gateway-system --type json -p '[
            {
              "op": "add",
              "path": "/spec/listeners/-",
              "value": {
                "name": "keycloak",
                "hostname": "keycloak.'"$E2E_DOMAIN"'",
                "port": 8081,
                "protocol": "HTTP",
                "allowedRoutes": {
                  "namespaces": {
                    "from": "All"
                  }
                }
              }
            }
          ]'
        fi

        # Create OpenShift Route to access Keycloak (via Gateway, HTTPRoute)
        kubectl apply -f - <<EOF
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: keycloak
            namespace: gateway-system
          spec:
            host: keycloak.$E2E_DOMAIN
            to:
              kind: Service
              name: mcp-gateway-$GATEWAY_CLASS_NAME
              weight: 100
            port:
              targetPort: keycloak
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
        EOF

        # Create HTTPRoute for Keycloak
        kubectl apply -f - <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: keycloak-route
          namespace: tools
        spec:
          parentRefs:
            - name: mcp-gateway
              namespace: gateway-system
              sectionName: keycloak
          hostnames:
            - 'keycloak.$E2E_DOMAIN'
          rules:
            # OAuth discovery endpoint rewrite rule for mcp realm
            - matches:
                - path:
                    type: Exact
                    value: /.well-known/oauth-authorization-server/realms/mcp
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplaceFullPath
                      replaceFullPath: /realms/mcp/.well-known/oauth-authorization-server
              backendRefs:
                - name: keycloak
                  port: 8080
            # Default rule for all other paths
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              filters:
                - type: ResponseHeaderModifier
                  responseHeaderModifier:
                    remove:
                      - Access-Control-Allow-Origin
                      - Access-Control-Allow-Credentials
                      - Access-Control-Allow-Headers
                      - Access-Control-Allow-Methods
                    set:
                      - name: Access-Control-Allow-Origin
                        value: 'http://localhost:6274'
                      - name: Access-Control-Allow-Credentials
                        value: 'true'
                      - name: Access-Control-Allow-Headers
                        value: 'Content-Type, Authorization'
                      - name: Access-Control-Allow-Methods
                        value: 'POST, OPTIONS'
              backendRefs:
                - name: keycloak
                  port: 8080
        EOF

        # Envoy Filter to workaround CORS issues
        kubectl apply -f - <<EOF
        apiVersion: networking.istio.io/v1alpha3
        kind: EnvoyFilter
        metadata:
          name: keycloak-preflight-204
          namespace: gateway-system
        spec:
          workloadSelector:
            labels:
              istio: ingressgateway
          configPatches:
          - applyTo: HTTP_ROUTE
            match:
              context: GATEWAY
              routeConfiguration:
                vhost:
                  name: "keycloak.$E2E_DOMAIN:8081"
            patch:
              operation: INSERT_FIRST
              value:
                name: kc-preflight-clients-registrations
                match:
                  path: "/realms/mcp/clients-registrations/openid-connect"
                  headers:
                  - name: ":method"
                    exact_match: "OPTIONS"
                direct_response:
                  status: 204
                response_headers_to_add:
                - header: { key: access-control-allow-origin,      value: "%REQ(ORIGIN)%" }
                - header: { key: access-control-allow-methods,     value: "POST, OPTIONS" }
                - header: { key: access-control-allow-headers,     value: "Content-Type, Authorization" }
                - header: { key: access-control-allow-credentials, value: "true" }
                - header: { key: vary,                              value: "Origin" }
                - header: { key: content-length,                    value: "0" }
        EOF

        # Configure trusted headers private key
        kubectl apply -f ./config/samples/oauth-token-exchange/trusted-headers-private-key.yaml -n $MCP_GATEWAY_NAMESPACE

        # Create required AuthPolicies
        sed -e "s|https://keycloak.127-0-0-1.sslip.io:8002|${KEYCLOAK_URL}|g" -e "s|http://mcp.127-0-0-1.sslip.io:8001|https://mcp.${E2E_DOMAIN}|g" -e "s|namespace: mcp-system|namespace: ${MCP_GATEWAY_NAMESPACE}|g" config/e2e/auth/mcp-auth-policy.yaml | \
          kubectl apply -f -

        # The auth test suite expects backend tool authorization denials to return 403.
        sed -e "s|https://keycloak.127-0-0-1.sslip.io:8002|${KEYCLOAK_URL}|g" -e "s|http://mcp.127-0-0-1.sslip.io:8001|https://mcp.${E2E_DOMAIN}|g" config/e2e/auth/mcps-auth-policy.yaml | \
          kubectl patch --local -f - --type=merge \
            -p '{"spec":{"rules":{"response":{"unauthorized":{"code":403}}}}}' -o yaml | \
          kubectl apply -f -

        # Patch Authorino to trust default OpenShift ingress certificate
        # Already done as part of Kuadrant installation
        # see https://github.com/Kuadrant/helm-charts-olm/blob/main/charts/kuadrant-instances/templates/kuadrant/03-ca-trust-hook.yaml

        # Path OIDC-enabled MCP server to trust default OpenShift ingress certificate
        kubectl set env deployment/mcp-oidc-server -n mcp-test ISSUER_URL=$KEYCLOAK_URL/realms/mcp
        kubectl patch deployment mcp-oidc-server -n mcp-test --type='json' -p='[
        {
          "op": "add",
          "path": "/spec/template/spec/volumes",
          "value": [{
            "name": "ocp-router-ca",
            "configMap": {
              "name": "kube-root-ca.crt"
            }
          }]
        },
        {
          "op": "add",
          "path": "/spec/template/spec/containers/0/volumeMounts",
          "value": [{
            "name": "ocp-router-ca",
            "mountPath": "/etc/ssl/certs",
            "readOnly": true
          }]
        }
        ]'

        if [ "$(params.run-tests)" = "true" ]; then
          cd "$(workspaces.shared-workspace.path)/kuadrant-operator"

          # Copy the auth tests file and create a small suite_test.go to execute
          # the auth tests against the existing cluster. Use a dedicated suite to
          # avoid starting another operator and losing kubeconfig bearer credentials.
          AUTH_TEST_DIR=$(mktemp -d "$PWD/mcp-auth-e2e.XXXXXX")
          cp tests/istio/mcp_gateway_auth_test.go "$AUTH_TEST_DIR/"
          cat > "$AUTH_TEST_DIR/suite_test.go" <<'GO'
        package istio_test

        import (
            "testing"
            "time"

            . "github.com/onsi/ginkgo/v2"
            . "github.com/onsi/gomega"
            "k8s.io/apimachinery/pkg/runtime"
            clientgoscheme "k8s.io/client-go/kubernetes/scheme"
            "sigs.k8s.io/controller-runtime/pkg/client"
            "sigs.k8s.io/controller-runtime/pkg/client/config"
            gatewayapiv1 "sigs.k8s.io/gateway-api/apis/v1"
        )

        var k8sClient client.Client

        func testClient() client.Client { return k8sClient }

        func TestMCPAuth(t *testing.T) {
            RegisterFailHandler(Fail)
            SetDefaultEventuallyPollingInterval(500 * time.Millisecond)
            SetDefaultEventuallyTimeout(2 * time.Minute)
            RunSpecs(t, "MCP Gateway AuthPolicy integration")
        }

        var _ = BeforeSuite(func() {
            cfg, err := config.GetConfig()
            Expect(err).NotTo(HaveOccurred())
            s := runtime.NewScheme()
            Expect(clientgoscheme.AddToScheme(s)).To(Succeed())
            Expect(gatewayapiv1.Install(s)).To(Succeed())
            k8sClient, err = client.New(cfg, client.Options{Scheme: s})
            Expect(err).NotTo(HaveOccurred())
        })
        GO

          GINKGO_RC=0
          go test -count=1 -v -tags=integration,mcp_auth_e2e -timeout="$E2E_TIMEOUT" "$AUTH_TEST_DIR" \
            -ginkgo.v -ginkgo.timeout="$E2E_TIMEOUT" -ginkgo.fail-on-empty \
            -ginkgo.junit-report="$(workspaces.shared-workspace.path)/junit-e2e-auth-report.xml" \
            -ginkgo.skip='rejects an unauthorized tool call' \
            -ginkgo.focus="MCP Gateway AuthPolicy integration" || GINKGO_RC=$?
          REPORT="$(workspaces.shared-workspace.path)/junit-e2e-auth-report.xml"
          # Clean up Ginkgo JUnit XML for ReportPortal:
          #  - Keep only MCP Gateway AuthPolicy specs (also removes suite setup/teardown)
          #    Preserve all auth skips, including those caused by an earlier Ordered test failure.
          #  - Remove <properties> block (Ginkgo metadata that causes RP to silently fail suite creation)
          #  - Rename testsuite/classname so tests appear grouped under 'e2e-auth' in RP
          #  - Recalculate counts after removing testcases
          if [ -f "$REPORT" ]; then
            python3.11 - "$REPORT" <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        tree = ET.parse(sys.argv[1])
        root = tree.getroot()
        for suite in root.findall("testsuite"):
            for testcase in suite.findall("testcase"):
                if "AuthPolicy" not in testcase.get("name", ""):
                    suite.remove(testcase)
                else:
                    testcase.set("classname", "tests.e2e.auth")
            for properties in suite.findall("properties"):
                suite.remove(properties)
            suite.set("name", "e2e-auth")
            skipped = suite.findall("testcase/skipped")
            pending = sum(item.get("message") == "pending" for item in skipped)
            suite.set("tests", str(len(suite.findall("testcase"))))
            suite.set("failures", str(len(suite.findall("testcase/failure"))))
            suite.set("errors", str(len(suite.findall("testcase/error"))))
            suite.set("disabled", str(pending))
            suite.set("skipped", str(len(skipped) - pending))

        for attribute in ("tests", "failures", "errors"):
            root.set(attribute, str(sum(int(suite.get(attribute)) for suite in root.findall("testsuite"))))
        # Ginkgo's root disabled count includes both pending and skipped tests.
        root.set("disabled", str(len(root.findall("testsuite/testcase/skipped"))))
        tree.write(sys.argv[1], encoding="utf-8", xml_declaration=True)
        PY
          fi
          exit $GINKGO_RC
        else
          echo "Skipping auth e2e test execution (run-tests=false)"
        fi

  workspaces:
    - name: shared-workspace
