apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-conformance-tests
spec:
  params:
    - description: Path to workspace kubeconfig
      name: kubeconfig-path
      type: string
    - description: MCP conformance test suite version
      name: conformance-version
      type: string
      default: "0.1.15"
  steps:
    - name: run-conformance-tests
      image: quay.io/kuadrant/testsuite-pipelines-tools:latest
      imagePullPolicy: Always
      env:
      - name: KUBECONFIG
        value: $(params.kubeconfig-path)
      - name: CONFORMANCE_VERSION
        value: $(params.conformance-version)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        # get URL to MCP Gateway
        BASE_DOMAIN="$(oc get dns cluster -o jsonpath='{.spec.baseDomain}')"
        MCP_GATEWAY_HOST="mcp.apps.$(oc get dns cluster -o jsonpath='{.spec.baseDomain}')"
        MCP_GATEWAY_URL="https://${MCP_GATEWAY_HOST}/mcp"

        # create mcp-test namespace if it does not exist
        oc create namespace mcp-test --dry-run=client -o yaml | oc apply -f -

        # deploy and register conformance MCP server
        cd "$(workspaces.shared-workspace.path)/mcp-gateway"
        oc apply -k config/test-servers/conformance-server/

        # patch imagePullPolicy to pull the image from remote registry
        oc patch deployment conformance-server -n mcp-test --type='json' -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}]'

        # patch the conformance server HTTPRoute to match 'mcp-tls' Listener:
        oc patch httproute conformance-server-route -n mcp-test --type='json' -p='[{"op":"replace","path":"/spec/hostnames/0","value":"conformance-server.apps.'"$BASE_DOMAIN"'"}]'

        oc wait --for=condition=Available deployment -n mcp-test -l app=conformance-server --timeout=60s
        oc apply -f config/samples/mcpserverregistration-conformance-server.yaml
        oc wait --for=condition=Ready mcpsr/conformance-server -n mcp-test --timeout=120s

        sleep 60

        # disable TLS verification for Node.js
        export NODE_TLS_REJECT_UNAUTHORIZED=0

        echo "Version used: ${CONFORMANCE_VERSION}"

        SCENARIOS=(
          server-initialize
          tools-list
          ping
          tools-call-simple-text
          tools-call-image
          tools-call-audio
          tools-call-embedded-resource
          tools-call-mixed-content
          tools-call-error
          tools-call-with-progress
        )

        CONFORMANCE_RESULTS="$(workspaces.shared-workspace.path)/conformance-results"

        FAILED_SCENARIOS=()
        for scenario in "${SCENARIOS[@]}"; do
          echo "=== Running scenario: $scenario ==="
          if ! npx @modelcontextprotocol/conformance@${CONFORMANCE_VERSION} server \
            --url "${MCP_GATEWAY_URL}" \
            --scenario "$scenario" \
            --output-dir "$CONFORMANCE_RESULTS" \
            --verbose; then
            echo "FAILED: $scenario"
            FAILED_SCENARIOS+=("$scenario")
          else
            echo "PASSED: $scenario"
          fi
          sleep 20
        done

        # Generate JUnit XML report from conformance check results
        JUNIT_REPORT="$(workspaces.shared-workspace.path)/junit-conformance-report.xml"
        TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S)"

        if ! find "$CONFORMANCE_RESULTS" -name 'checks.json' 2>/dev/null | grep -q .; then
          echo "ERROR: No checks.json files found under $CONFORMANCE_RESULTS"
          exit 1
        fi

        # Merge all checks.json files into a single JSON array
        echo "=== Generating JUnit XML report from checks.json files ==="
        MERGED_CHECKS=$(find "$CONFORMANCE_RESULTS" -name 'checks.json' -print0 | xargs -0 jq -s 'add')

        # Count totals for the testsuite element
        TOTAL=$(echo "$MERGED_CHECKS" | jq 'length')
        FAILURES=$(echo "$MERGED_CHECKS" | jq '[.[] | select(.status == "FAILURE")] | length')
        SKIPPED=$(echo "$MERGED_CHECKS" | jq '[.[] | select(.status == "SKIPPED")] | length')

        # Generate JUnit XML header
        {
          echo '<?xml version="1.0" encoding="UTF-8"?>'
          echo '<testsuites>'
          echo "  <testsuite name=\"mcp-conformance\" tests=\"${TOTAL}\" failures=\"${FAILURES}\" skipped=\"${SKIPPED}\" time=\"0\" timestamp=\"${TIMESTAMP}\">"

          # Generate a <testcase> element for each check result
          echo "$MERGED_CHECKS" | jq -r '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;") | gsub("\"";"&quot;");
            .[] |
            "    <testcase name=\"\(.id | esc)\" classname=\"tests.conformance\" time=\"0\">" +
            (if .status == "FAILURE" then
              "\n      <failure message=\"\((.errorMessage // "check failed") | esc)\">" +
              (if .logs then (.logs | join("\n") | esc) else "" end) +
              "</failure>"
            elif .status == "SKIPPED" then
              "\n      <skipped/>"
            else "" end) +
            "\n    </testcase>"
          '

          echo '  </testsuite>'
          echo '</testsuites>'
        } > "$JUNIT_REPORT"
        echo "JUnit XML report written to $JUNIT_REPORT"

        if [ ${#FAILED_SCENARIOS[@]} -gt 0 ]; then
          echo ""
          echo "=== Summary: ${#FAILED_SCENARIOS[@]} scenario(s) failed ==="
          for failed in "${FAILED_SCENARIOS[@]}"; do
            echo "  - $failed"
          done
          exit 1
        fi

        echo ""
        echo "=== All scenarios passed ==="
  workspaces:
    - name: shared-workspace
